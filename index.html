<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفيديوهات القصيرة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* حاوية الفيديوهات الرئيسية (تكون بحجم الشاشة) */
        .reels-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #111;
            position: relative;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* إخفاء الشريط لمتصفحات فايرفوكس */
        }
        .reels-container::-webkit-scrollbar { display: none; /* إخفاء الشريط لمتصفحات كروم وسفاري */ }

        /* كل فيديو وشاشته */
        .reel-card {
            width: 100%;
            height: 100vh;
            position: relative;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .reel-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* تفاصيل وصناع المحتوى أسفل الفيديو */
        .reel-info {
            position: absolute;
            bottom: 20px;
            right: 15px;
            left: 70px;
            text-align: right;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .username { font-weight: bold; font-size: 15px; margin-bottom: 5px; }
        .description { font-size: 13px; color: #ddd; }

        /* أزرار التفاعل الجانبية (إعجاب، تعليق، مشاركة) */
        .action-buttons {
            position: absolute;
            bottom: 30px;
            left: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 2;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            transition: transform 0.2s;
        }
        .action-btn:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.2); }
        .action-label { font-size: 11px; margin-top: 2px; text-align: center; }
    </style>
</head>
<body>

    <div class="reels-container">
        <!-- فيديو رقم 1 -->
        <div class="reel-card">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay muted playsinline></video>
            
            <div class="action-buttons">
                <div>
                    <button class="action-btn" onclick="toggleLike(this)">❤️</button>
                    <div class="action-label">12.5K</div>
                </div>
                <div>
                    <button class="action-btn">💬</button>
                    <div class="action-label">430</div>
                </div>
                <div>
                    <button class="action-btn">↗️</button>
                    <div class="action-label">مشاركة</div>
                </div>
            </div>

            <div class="reel-info">
                <div class="username">@ibrahim_fathy</div>
                <div class="description">تجربة تصميم واجهة فيديوهات قصيرة شبيهة بتيك توك برمجة ذاتية 🚀 #تطوير_مواقع</div>
            </div>
        </div>

        <!-- فيديو رقم 2 -->
        <div class="reel-card">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop muted playsinline></video>
            
            <div class="action-buttons">
                <div>
                    <button class="action-btn" onclick="toggleLike(this)">❤️</button>
                    <div class="action-label">8.2K</div>
                </div>
                <div>
                    <button class="action-btn">💬</button>
                    <div class="action-label">120</div>
                </div>
                <div>
                    <button class="action-btn">↗️</button>
                    <div class="action-label">مشاركة</div>
                </div>
            </div>

            <div class="reel-info">
                <div class="username">@sinai_cement</div>
                <div class="description">أجواء العمل داخل المصنع اليوم بالتوفيق للجميع 👷‍♂️⚙️</div>
            </div>
        </div>
    </div>

    <script>
        // تشغيل وإيقاف الفيديو عند الضغط عليه، وتفعيل التمرير التلقائي للصوت
        document.querySelectorAll('.reel-card video').forEach(video => {
            video.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });
        });

        // تشغيل الفيديو الظاهر في الشاشة فقط وإيقاف الباقي (Intersection Observer)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play();
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.6 });

        document.querySelectorAll('.reel-card').forEach(card => {
            observer.observe(card);
        });

        function toggleLike(btn) {
            btn.style.color = btn.style.color === 'red' ? 'white' : 'red';
        }
    </script>
</body>
</html>
